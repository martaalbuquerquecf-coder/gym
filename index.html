<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Treino</title>
<style>
  :root{
    --bg:#121317;
    --surface:#1b1d23;
    --surface-2:#24262e;
    --surface-3:#2e313b;
    --border:#3a3d4870;
    --text:#f1f1f3;
    --text-muted:#9a9ea9;
    --text-faint:#5c606c;
    --accent:#5b6ef5;
    --accent-2:#22d3ee;
    --accent-grad:linear-gradient(135deg,#5b6ef5,#22a8ee);
    --accent-dim:#5b6ef522;
    --glow:0 6px 20px -4px #5b6ef566;
    --good:#4caf7d;
    --radius-s:10px;
    --radius-m:16px;
    --radius-l:22px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:#0a0b0d;
    color:var(--text);
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI Rounded","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
  }
  #shell{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:
      radial-gradient(600px 300px at 100% -10%, #5b6ef522, transparent 60%),
      radial-gradient(500px 260px at -10% 0%, #22d3ee14, transparent 55%),
      var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 60px rgba(0,0,0,.5);
  }
  header.topbar{
    padding:calc(18px + var(--safe-top)) 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    background:linear-gradient(var(--bg) 80%, transparent);
    z-index:5;
  }
  header.topbar h1{
    font-size:27px;
    margin:0;
    font-weight:800;
    letter-spacing:-0.025em;
    background:linear-gradient(100deg,#fff, #fff 55%, var(--accent-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header.topbar .sub{
    font-size:13px;
    color:var(--text-muted);
    margin-top:2px;
  }
  .icon-btn{
    width:38px;height:38px;border-radius:50%;
    background:var(--surface-2);
    border:none;color:var(--text);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .icon-btn:active{background:var(--surface-3);}
  main{
    flex:1;
    padding:0 20px calc(96px + var(--safe-bottom));
    overflow-y:auto;
  }
  nav.tabbar{
    position:fixed;
    bottom:0;
    width:100%;
    max-width:480px;
    padding:10px 10px calc(10px + var(--safe-bottom));
    background:rgba(20,21,26,.92);
    backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
    display:flex;
    z-index:20;
  }
  nav.tabbar button{
    flex:1;
    background:none;border:none;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--text-faint);
    font-size:11px;
    padding:6px 0 2px;
    cursor:pointer;
    font-family:inherit;
  }
  nav.tabbar button svg{width:22px;height:22px;stroke:var(--text-faint);fill:none;stroke-width:1.8;}
  nav.tabbar button.active{color:var(--text);}
  nav.tabbar button.active svg{stroke:var(--accent);filter:drop-shadow(0 0 6px #5b6ef588);}
  nav.tabbar button.active span{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;}

  h2.section-title{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:18px 0 12px;display:flex;align-items:center;gap:9px;}
  h2.section-title::before{content:"";width:4px;height:18px;border-radius:3px;background:var(--accent-grad);display:inline-block;}
  .card{
    background:linear-gradient(180deg, var(--surface), var(--surface) 60%, var(--surface-2));
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    padding:16px;
    margin-bottom:12px;
    box-shadow:0 8px 24px -16px rgba(0,0,0,.6);
  }
  .muted{color:var(--text-muted);}
  .faint{color:var(--text-faint);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--accent-grad);color:#fff;border:none;
    padding:13px 18px;border-radius:14px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:inherit;
    box-shadow:var(--glow);
    transition:transform .12s, filter .12s;
  }
  .btn:active{filter:brightness(.9);transform:scale(.98);}
  .btn.block{width:100%;}
  .btn.ghost{background:var(--surface-2);color:var(--text);box-shadow:none;}
  .btn.outline{background:transparent;border:1.5px dashed var(--border);color:var(--text-muted);box-shadow:none;}
  .btn.small{padding:8px 12px;font-size:13px;border-radius:10px;}
  .btn.danger{background:#3a1e24;color:#f28b9a;box-shadow:none;}
  .btn:disabled{opacity:.4;}
  input,select,textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:11px 12px;
    font-size:15px;
    font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;}
  label.field-label{font-size:12.5px;color:var(--text-muted);margin:0 0 6px;display:block;font-weight:600;}
  .field{margin-bottom:14px;}
  textarea{resize:vertical;min-height:64px;}

  /* Calendar */
  .cal-card{background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--border);border-radius:var(--radius-l);padding:18px 14px 14px;box-shadow:0 10px 30px -18px rgba(0,0,0,.7);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 4px;}
  .cal-head .title{font-size:16px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;}
  .cal-nav{background:none;border:none;color:var(--text-muted);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .cal-nav:active{background:var(--surface-2);}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--text-faint);font-weight:700;margin-bottom:6px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px;}
  .cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;}
  .cal-day{
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;color:var(--text-muted);
    border:1.5px solid transparent;
    cursor:pointer;
  }
  .cal-day.empty{visibility:hidden;cursor:default;}
  .cal-day.done{background:var(--accent-grad);color:#fff;font-weight:800;box-shadow:0 4px 14px -4px #5b6ef580;}
  .cal-day.today{border-color:var(--accent-2);color:var(--text);font-weight:800;}
  .cal-day.today.done{border-color:#fff;}
  .cal-day.future{color:var(--text-faint);}
  .cal-day:not(.empty):active{transform:scale(.9);}

  .legend{display:flex;gap:16px;margin-top:14px;font-size:12px;color:var(--text-muted);}
  .legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;}

  .stat-row{display:flex;gap:10px;margin-bottom:6px;}
  .stat{flex:1;background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;}
  .stat .num{font-size:23px;font-weight:800;background:linear-gradient(90deg,#fff,var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat .lbl{font-size:11px;color:var(--text-muted);margin-top:2px;}

  /* lists */
  .list-item{
    display:flex;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;
    transition:transform .12s, border-color .12s;
  }
  .list-item:active{transform:scale(.985);border-color:#5b6ef555;}
  .thumb{width:48px;height:48px;border-radius:12px;background:var(--surface-3);object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--accent-2);font-size:18px;border:1px solid var(--border);}
  .list-item .meta{flex:1;min-width:0;}
  .list-item .name{font-weight:700;font-size:15px;}
  .list-item .desc{font-size:12.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chev{color:var(--text-faint);}

  .empty-state{text-align:center;padding:46px 20px;color:var(--text-muted);}
  .empty-state .big{
    font-size:32px;width:68px;height:68px;line-height:68px;border-radius:50%;
    background:var(--surface-2);margin:0 auto 16px;box-shadow:inset 0 0 0 1.5px var(--border);
  }

  /* week plan */
  .week-row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--border);}
  .week-row:last-child{border-bottom:none;}
  .week-day{width:78px;font-weight:800;font-size:14px;}
  .week-select{flex:1;}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(5,5,8,.6);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .sheet{
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;
    background:var(--surface);border-radius:24px 24px 0 0;
    padding:16px 20px calc(24px + var(--safe-bottom));
    transform:translateY(20px);transition:transform .2s;
  }
  .overlay.open .sheet{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;background:var(--surface-3);border-radius:2px;margin:0 auto 14px;}
  .sheet-title{font-size:19px;font-weight:800;margin:0 0 16px;}

  .photo-upload{
    display:flex;align-items:center;gap:12px;margin-bottom:14px;
  }
  .photo-preview{width:64px;height:64px;border-radius:14px;background:var(--surface-2);object-fit:cover;border:1px solid var(--border);}
  .photo-preview.empty{display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:22px;}

  /* exercise picker */
  .search-box{margin-bottom:12px;}
  .pick-item{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--border);cursor:pointer;}
  .pick-item:last-child{border-bottom:none;}

  /* train session */
  .ex-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;}
  .ex-card .head{display:flex;gap:12px;margin-bottom:12px;}
  .ex-card .head .name{font-weight:800;font-size:16px;}
  .ex-card .head .desc{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
  table.sets{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.sets th{color:var(--text-faint);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;padding:0 4px 8px;text-align:center;}
  table.sets th:first-child{text-align:left;padding-left:0;}
  table.sets td{padding:4px;text-align:center;}
  table.sets td:first-child{text-align:left;color:var(--text-muted);font-weight:700;padding-left:0;width:22px;}
  table.sets input{padding:9px 4px;text-align:center;font-size:14px;}
  table.sets .prev{color:var(--text-faint);font-size:12.5px;}
  .toast{
    position:fixed;bottom:calc(100px + var(--safe-bottom));left:50%;transform:translateX(-50%);
    background:var(--good);color:#08150f;font-weight:700;font-size:14px;
    padding:12px 20px;border-radius:30px;z-index:200;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;margin-bottom:16px;}
  .seg button{flex:1;background:none;border:none;color:var(--text-muted);font-weight:700;font-size:13px;padding:9px 0;border-radius:9px;font-family:inherit;cursor:pointer;}
  .seg button.active{background:var(--accent-grad);color:#fff;box-shadow:var(--glow);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  a.link{color:var(--accent-2);}
</style>
</head>
<body>
<div id="shell">
  <div id="app"></div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>
</div>

<script>
(function(){
"use strict";

/* ---------------- storage ---------------- */
var KEY = "gymtracker_data_v1";
var db = load();
function defaultDb(){
  return { exercises:{}, templates:{}, templateOrder:[], weeklyPlan:{0:null,1:null,2:null,3:null,4:null,5:null,6:null}, logs:{} };
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return defaultDb();
    var parsed = JSON.parse(raw);
    var d = defaultDb();
    return Object.assign(d, parsed);
  }catch(e){ return defaultDb(); }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------------- state ---------------- */
var state = {
  tab: "cal",
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(),
  templatesView: "list", // list | detail | library
  currentTemplateId: null,
  editingExerciseId: null,
  trainDate: todayKey(),
  trainTemplateId: null,
  trainSessionOpen: false
};

function todayKey(){ return fmtDate(new Date()); }
function fmtDate(d){
  var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}
var WEEKDAY_NAMES = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
var WEEKDAY_SHORT = ["D","S","T","Q","Q","S","S"];
var MONTH_NAMES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

/* ---------------- helpers ---------------- */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function templatesArr(){
  return db.templateOrder.map(function(id){ return db.templates[id]; }).filter(Boolean);
}
function exercisesArr(){
  return Object.values(db.exercises).sort(function(a,b){ return a.name.localeCompare(b.name); });
}
function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._h);
  showToast._h = setTimeout(function(){ t.classList.remove("show"); }, 1800);
}
function resizeImage(file, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var maxDim = 480;
      var w = img.width, h = img.height;
      if(w>h && w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
      else if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      cb(canvas.toDataURL("image/jpeg", 0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* previous performance for an exercise, before (or on, excluding) a given date */
function getPrevious(exerciseId, beforeDateKey, excludeDateKey){
  var keys = Object.keys(db.logs).filter(function(k){
    return k < beforeDateKey || (k===beforeDateKey && k!==excludeDateKey && false);
  });
  keys = Object.keys(db.logs).filter(function(k){ return k < beforeDateKey; });
  keys.sort().reverse();
  for(var i=0;i<keys.length;i++){
    var log = db.logs[keys[i]];
    var item = log.items.find(function(it){ return it.exerciseId===exerciseId; });
    if(item && item.sets && item.sets.some(function(s){ return s.weight!=="" && s.weight!=null; })){
      return { date: keys[i], sets: item.sets };
    }
  }
  return null;
}

/* ---------------- modal ---------------- */
function openModal(html){
  var root = document.getElementById("modalRoot");
  root.innerHTML = '<div class="overlay" id="ovl"><div class="sheet">'+
    '<div class="sheet-handle"></div>'+html+'</div></div>';
  requestAnimationFrame(function(){ document.getElementById("ovl").classList.add("open"); });
  document.getElementById("ovl").addEventListener("click", function(e){
    if(e.target.id==="ovl") closeModal();
  });
}
function closeModal(){
  var ovl = document.getElementById("ovl");
  if(!ovl) return;
  ovl.classList.remove("open");
  setTimeout(function(){ document.getElementById("modalRoot").innerHTML=""; }, 200);
}

/* ---------------- icons ---------------- */
var ICONS = {
  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  week:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M7 13h3M7 17h3M14 13h3M14 17h3"/></svg>',
  dumbbell:'<svg viewBox="0 0 24 24"><path d="M6.5 7v10M17.5 7v10M2.5 10v4M21.5 10v4M6.5 12h11"/></svg>',
  play:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z" fill="currentColor" stroke="none"/></svg>',
  gear:'<svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5c.04-.5.04-1 0-1.5l1.9-1.5-2-3.4-2.3.6c-.4-.3-.8-.6-1.3-.8l-.3-2.4h-4l-.3 2.4c-.5.2-.9.5-1.3.8l-2.3-.6-2 3.4 1.9 1.5c-.04.5-.04 1 0 1.5l-1.9 1.5 2 3.4 2.3-.6c.4.3.8.6 1.3.8l.3 2.4h4l.3-2.4c.5-.2.9-.5 1.3-.8l2.3.6 2-3.4z"/></svg>',
  back:'<svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" fill="none" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  photo:'<svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5.5-5.5L8 18"/></svg>'
};

/* ================= RENDER: root ================= */
function render(){
  var app = document.getElementById("app");
  var html = '<header class="topbar">' + topbarHtml() + '</header><main id="main">' + tabHtml() + '</main>' + navHtml();
  app.innerHTML = html;
  attachHandlers();
}

function topbarHtml(){
  var titles = { cal:["Progresso","O teu historial de treinos"], week:["Semana","Planeia os teus dias fixos"], templates:["Treinos","Templates e exercícios"], train:["Treinar","Regista pesos e repetições"] };
  var t = titles[state.tab];
  return '<div><h1>'+t[0]+'</h1><div class="sub">'+t[1]+'</div></div>'+
    '<button class="icon-btn" id="btnSettings">'+ICONS.gear+'</button>';
}

function navHtml(){
  function b(key, icon, label){
    return '<button data-tab="'+key+'" class="'+(state.tab===key?"active":"")+'">'+ICONS[icon]+'<span>'+label+'</span></button>';
  }
  return '<nav class="tabbar">'+
    b("cal","cal","Progresso")+
    b("week","week","Semana")+
    b("templates","dumbbell","Treinos")+
    b("train","play","Treinar")+
    '</nav>';
}

function tabHtml(){
  if(state.tab==="cal") return renderCalTab();
  if(state.tab==="week") return renderWeekTab();
  if(state.tab==="templates") return renderTemplatesTab();
  if(state.tab==="train") return renderTrainTab();
  return "";
}

/* ================= CALENDAR TAB ================= */
function renderCalTab(){
  var y = state.calYear, m = state.calMonth;
  var first = new Date(y,m,1);
  var startWeekday = first.getDay();
  var daysInMonth = new Date(y,m+1,0).getDate();
  var todK = todayKey();

  var cells = "";
  for(var i=0;i<startWeekday;i++) cells += '<div class="cal-cell"><div class="cal-day empty"></div></div>';
  for(var d=1; d<=daysInMonth; d++){
    var dk = y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    var isDone = !!db.logs[dk];
    var isToday = dk===todK;
    var isFuture = dk>todK;
    var cls = "cal-day"+(isDone?" done":"")+(isToday?" today":"")+(isFuture&&!isDone?" future":"");
    cells += '<div class="cal-cell"><div class="'+cls+'" data-day="'+dk+'">'+d+'</div></div>';
  }

  var totalThisMonth = Object.keys(db.logs).filter(function(k){ return k.slice(0,7)===y+"-"+String(m+1).padStart(2,"0"); }).length;
  var totalAll = Object.keys(db.logs).length;
  var streak = computeStreak();

  return ''+
  '<div class="stat-row">'+

  '</div>'+

    '<div class="cal-head">'+

    '</div>'+
    '<div class="cal-weekdays">'+WEEKDAY_SHORT.map(function(w){return '<div>'+w+'</div>';}).join("")+'</div>'+

  '</div>';
}
function computeStreak(){
  var n=0, d=new Date();
  while(true){
    var k=fmtDate(d);
    if(db.logs[k]){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}

/* day detail modal */
function openDayModal(dk){
  var log = db.logs[dk];
  var dateObj = new Date(dk+"T00:00:00");
  var dateLabel = dateObj.toLocaleDateString ? (dateObj.getDate()+" de "+MONTH_NAMES[dateObj.getMonth()]+" de "+dateObj.getFullYear()) : dk;
  if(!log){
    openModal(
      '<div class="sheet-title">'+dateLabel+'</div>'+
      '<p class="muted">Ainda não há treino registado neste dia.</p>'+
      '<button class="btn block" id="dmGoTrain">Registar treino neste dia</button>'
    );
    document.getElementById("dmGoTrain").onclick = function(){
      closeModal();
      state.trainDate = dk;
      state.trainTemplateId = db.weeklyPlan[dateObj.getDay()] || (templatesArr()[0] && templatesArr()[0].id) || null;
      state.trainSessionOpen = false;
      state.tab = "train";
      render();
    };
    return;
  }
  var body = log.items.map(function(it){
    var rows = it.sets.map(function(s,i){
      return '<tr><td>'+(i+1)+'</td><td>'+(s.weight!==""&&s.weight!=null?s.weight+" kg":"–")+'</td><td>'+(s.reps!==""&&s.reps!=null?s.reps:"–")+'</td></tr>';
    }).join("");
    return '<div class="card"><div class="row"><strong>'+esc(it.name)+'</strong></div>'+
      '<table class="sets" style="margin-top:8px"><tr><th>#</th><th>Peso</th><th>Reps</th></tr>'+rows+'</table></div>';
  }).join("");
  openModal(
    '<div class="sheet-title">'+dateLabel+'</div>'+
    '<p class="muted" style="margin-top:-10px">'+esc(log.templateName||"Treino")+'</p>'+
    body+
    '<div class="row" style="gap:10px;margin-top:6px">'+
      '<button class="btn ghost block" id="dmEdit">Editar</button>'+
      '<button class="btn danger block" id="dmDelete">Apagar</button>'+
    '</div>'
  );
  document.getElementById("dmEdit").onclick = function(){
    closeModal();
    state.trainDate = dk;
    state.trainTemplateId = log.templateId;
    state.trainSessionOpen = true;
    state.tab = "train";
    render();
  };
  document.getElementById("dmDelete").onclick = function(){
    if(confirm("Apagar o registo deste treino?")){
      delete db.logs[dk];
      save();
      closeModal();
      render();
    }
  };
}

function openExerciseForm(exerciseId, tidToAddAfter){
  var ex = exerciseId ? db.exercises[exerciseId] : { name:"", description:"", photo:"" };
  var isEdit = !!exerciseId;
  openModal(
    '<div class="sheet-title">'+(isEdit?"Editar exercício":"Novo exercício")+'</div>'+
    '<div class="photo-upload">'+
      (ex.photo? '<img class="photo-preview" id="photoPreview" src="'+ex.photo+'">' : '<div class="photo-preview empty" id="photoPreview">'+ICONS.photo+'</div>')+
      '<div><button class="btn ghost small" id="btnPickPhoto">Escolher foto</button><input type="file" accept="image/*" id="photoInput" style="display:none"></div>'+
    '</div>'+
    '<div class="field"><label class="field-label">Nome do exercício</label><input id="exName" value="'+esc(ex.name)+'" placeholder="ex: Supino com halteres"></div>'+
    '<div class="field"><label class="field-label">Descrição (opcional)</label><textarea id="exDesc" placeholder="notas, técnica, link de vídeo...">'+esc(ex.description||"")+'</textarea></div>'+
    (isEdit? '<button class="btn block" id="btnSaveExercise" style="margin-bottom:10px">Guardar alterações</button><button class="btn danger block" id="btnDeleteExercise">Apagar exercício</button>'
            : '<button class="btn block" id="btnSaveExercise">Criar e continuar</button>')
  );
  var currentPhoto = ex.photo || "";
  document.getElementById("btnPickPhoto").onclick = function(){ document.getElementById("photoInput").click(); };
  document.getElementById("photoInput").onchange = function(e){
    var f = e.target.files[0];
    if(!f) return;
    resizeImage(f, function(dataUrl){
      currentPhoto = dataUrl;
      var prev = document.getElementById("photoPreview");
      prev.outerHTML = '<img class="photo-preview" id="photoPreview" src="'+dataUrl+'">';
    });
  };
  document.getElementById("btnSaveExercise").onclick = function(){
    var name = document.getElementById("exName").value.trim();
    if(!name){ alert("Dá um nome ao exercício."); return; }
    var desc = document.getElementById("exDesc").value.trim();
    if(isEdit){
      ex.name = name; ex.description = desc; ex.photo = currentPhoto;
      save(); closeModal(); render();
    } else {
      var newId = uid();
      db.exercises[newId] = { id:newId, name:name, description:desc, photo:currentPhoto };
      save();
      if(tidToAddAfter){
        closeModal();
        askSetsAndAdd(newId, tidToAddAfter);
      } else {
        closeModal(); render();
      }
    }
  };
  if(isEdit){
    document.getElementById("btnDeleteExercise").onclick = function(){
      if(confirm("Apagar este exercício da biblioteca? Vai desaparecer de todos os treinos.")){
        delete db.exercises[exerciseId];
        Object.values(db.templates).forEach(function(t){
          t.items = t.items.filter(function(it){ return it.exerciseId!==exerciseId; });
        });
        save(); closeModal(); render();
      }
    };
  }
}

/* ================= TRAIN TAB ================= */
function renderTrainTab(){
  var tpls = templatesArr();
  if(tpls.length===0){
    return '<div class="empty-state"><div class="big">▶️</div>Cria um template de treino no<br>separador "Treinos" para começares<br>a registar séries e pesos.</div>';
  }
  var dateObj = new Date(state.trainDate+"T00:00:00");
  var dow = dateObj.getDay();
  if(!state.trainTemplateId){
    state.trainTemplateId = db.weeklyPlan[dow] || tpls[0].id;
  }
  var opts = tpls.map(function(t){ return '<option value="'+t.id+'" '+(state.trainTemplateId===t.id?"selected":"")+'>'+esc(t.name)+'</option>'; }).join("");

  var setupHtml = '<div class="card">'+
    '<div class="field-row">'+
      '<div class="field"><label class="field-label">Data</label><input type="date" id="trainDate" value="'+state.trainDate+'"></div>'+
      '<div class="field"><label class="field-label">Treino</label><select id="trainTemplate">'+opts+'</select></div>'+
    '</div>'+
    '<button class="btn block" id="btnStartSession">'+(db.logs[state.trainDate]?"Continuar treino":"Iniciar treino")+'</button>'+
  '</div>';

  if(!state.trainSessionOpen) return setupHtml;

  var t = db.templates[state.trainTemplateId];
  if(!t) return setupHtml;
  var existingLog = db.logs[state.trainDate];
  var sessionHtml = t.items.map(function(it, itIdx){
    var ex = db.exercises[it.exerciseId];
    if(!ex) return "";
    var prev = getPrevious(it.exerciseId, state.trainDate);
    var existingItem = existingLog && existingLog.templateId===t.id ? existingLog.items.find(function(x){return x.exerciseId===it.exerciseId;}) : null;
    var rows = "";
    for(var s=0; s<it.sets; s++){
      var prevSet = prev && prev.sets[s];
      var prevText = prevSet && prevSet.weight!=="" && prevSet.weight!=null ? prevSet.weight+"kg × "+prevSet.reps : "–";
      var curSet = existingItem && existingItem.sets[s] ? existingItem.sets[s] : {weight:"",reps:""};
      rows += '<tr>'+
        '<td>'+(s+1)+'</td>'+
        '<td><input type="number" inputmode="decimal" step="0.5" class="weightInput" data-ex="'+it.exerciseId+'" data-set="'+s+'" value="'+(curSet.weight!=null?curSet.weight:"")+'" placeholder="kg"></td>'+
        '<td><input type="number" inputmode="numeric" class="repsInput" data-ex="'+it.exerciseId+'" data-set="'+s+'" value="'+(curSet.reps!=null?curSet.reps:"")+'" placeholder="reps"></td>'+
        '<td class="prev">'+prevText+'</td>'+
        '</tr>';
    }
    return '<div class="ex-card">'+
      '<div class="head">'+
        (ex.photo? '<img class="thumb" src="'+ex.photo+'">' : '<div class="thumb">💪</div>')+
        '<div><div class="name">'+esc(ex.name)+'</div>'+(ex.description? '<div class="desc">'+esc(ex.description)+'</div>':'')+'</div>'+
      '</div>'+
      '<table class="sets"><tr><th>#</th><th>Peso</th><th>Reps</th><th>Anterior</th></tr>'+rows+'</table>'+
    '</div>';
  }).join("");

  return setupHtml.replace('id="btnStartSession">'+(db.logs[state.trainDate]?"Continuar treino":"Iniciar treino")+'<',
                            'id="btnStartSession" style="display:none">x<') +
    '<h2 class="section-title" style="margin-top:4px">'+esc(t.name)+'</h2>'+
    sessionHtml+
    '<button class="btn block" id="btnFinishSession">Guardar treino</button>'+
    (existingLog ? '<button class="btn danger block" id="btnDeleteSession" style="margin-top:10px">Remover registo deste dia</button>' : '')+
    '<button class="btn ghost block" id="btnCancelSession" style="margin-top:10px">Fechar</button>';
}

/* ================= SETTINGS ================= */
function openSettings(){
  openModal(
    '<div class="sheet-title">Definições</div>'+
    '<p class="muted" style="margin-top:-10px">Os teus dados ficam guardados só neste telemóvel/navegador. Faz uma cópia de segurança de vez em quando.</p>'+
    '<button class="btn block" id="btnExport" style="margin-bottom:10px">Exportar cópia de segurança</button>'+
    '<button class="btn ghost block" id="btnImport" style="margin-bottom:10px">Importar cópia de segurança</button>'+
    '<input type="file" accept="application/json" id="importFile" style="display:none">'+
    '<button class="btn danger block" id="btnReset">Apagar todos os dados</button>'+
    '<p class="faint" style="font-size:11.5px;margin-top:16px;text-align:center">Guarda este ficheiro .html no telemóvel e abre-o no navegador — funciona sem internet e sem esta conversa.</p>'
  );
  document.getElementById("btnExport").onclick = function(){
    var blob = new Blob([JSON.stringify(db,null,2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "treino-backup-"+todayKey()+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  document.getElementById("btnImport").onclick = function(){ document.getElementById("importFile").click(); };
  document.getElementById("importFile").onchange = function(e){
    var f = e.target.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var parsed = JSON.parse(ev.target.result);
        if(confirm("Isto substitui os dados atuais pelos do ficheiro. Continuar?")){
          db = Object.assign(defaultDb(), parsed);
          save(); closeModal(); render();
          showToast("Dados importados!");
        }
      }catch(err){ alert("Ficheiro inválido."); }
    };
    reader.readAsText(f);
  };
  document.getElementById("btnReset").onclick = function(){
    if(confirm("Isto apaga TODOS os treinos, templates e histórico. Tens a certeza?")){
      if(confirm("De certeza mesmo? Esta ação não pode ser desfeita.")){
        db = defaultDb(); save(); closeModal(); render();
      }
    }
  };
}

/* ================= EVENT WIRING ================= */
function attachHandlers(){
  document.getElementById("btnSettings").onclick = openSettings;
  document.querySelectorAll("nav.tabbar button").forEach(function(btn){
    btn.onclick = function(){
      state.tab = btn.getAttribute("data-tab");
      if(state.tab==="templates"){ state.templatesView="list"; }
      render();
    };
  });

  if(state.tab==="cal"){
    document.getElementById("calPrev").onclick = function(){
      state.calMonth--; if(state.calMonth<0){ state.calMonth=11; state.calYear--; } render();
    };
    document.getElementById("calNext").onclick = function(){
      state.calMonth++; if(state.calMonth>11){ state.calMonth=0; state.calYear++; } render();
    };
    document.querySelectorAll("[data-day]").forEach(function(el){
      el.onclick = function(){ openDayModal(el.getAttribute("data-day")); };
    });
  }

  if(state.tab==="week"){
    document.querySelectorAll(".week-select").forEach(function(sel){
      sel.onchange = function(){
        var dow = sel.getAttribute("data-dow");
        db.weeklyPlan[dow] = sel.value || null;
        save();
      };
    });
  }

  if(state.tab==="templates"){
    var segBtns = document.querySelectorAll("[data-seg]");
    segBtns.forEach(function(b){
      b.onclick = function(){ state.templatesView = b.getAttribute("data-seg"); render(); };
    });
    var btnNew = document.getElementById("btnNewTemplate");
    if(btnNew) btnNew.onclick = function(){
      var id = uid();
      db.templates[id] = { id:id, name:"Novo treino", items:[] };
      db.templateOrder.push(id);
      save();
      state.templatesView="detail"; state.currentTemplateId=id; render();
    };
    document.querySelectorAll("[data-open-template]").forEach(function(el){
      el.onclick = function(){ state.currentTemplateId = el.getAttribute("data-open-template"); state.templatesView="detail"; render(); };
    });
    document.querySelectorAll("[data-edit-exercise]").forEach(function(el){
      el.onclick = function(){ openExerciseForm(el.getAttribute("data-edit-exercise"), null); };
    });
    var btnNewEx = document.getElementById("btnNewExercise");
    if(btnNewEx) btnNewEx.onclick = function(){ openExerciseForm(null, null); };

    if(state.templatesView==="detail"){
      var back = document.getElementById("btnBackTemplates");
      if(back) back.onclick = function(){ state.templatesView="list"; render(); };
      var nameInput = document.getElementById("tplName");
      var addBtn = document.getElementById("btnAddExercise");
      if(addBtn) addBtn.onclick = function(){ openExercisePicker(state.currentTemplateId); };
      document.querySelectorAll("[data-remove-item]").forEach(function(el){
        el.onclick = function(ev){
          ev.stopPropagation();
          var idx = parseInt(el.getAttribute("data-remove-item"),10);
          db.templates[state.currentTemplateId].items.splice(idx,1);
          save(); render();
        };
      });
      var saveBtn = document.getElementById("btnSaveTemplate");
      if(saveBtn) saveBtn.onclick = function(){
        db.templates[state.currentTemplateId].name = nameInput.value.trim() || "Treino";
        save(); showToast("Treino guardado!"); state.templatesView="list"; render();
      };
      var delBtn = document.getElementById("btnDeleteTemplate");
      if(delBtn) delBtn.onclick = function(){
        if(confirm("Apagar este treino?")){
          var id = state.currentTemplateId;
          delete db.templates[id];
          db.templateOrder = db.templateOrder.filter(function(x){ return x!==id; });
          Object.keys(db.weeklyPlan).forEach(function(k){ if(db.weeklyPlan[k]===id) db.weeklyPlan[k]=null; });
          save();
          state.templatesView="list"; render();
        }
      };
    }
  }

  if(state.tab==="train"){
    var dateInput = document.getElementById("trainDate");
    if(dateInput) dateInput.onchange = function(){ state.trainDate = dateInput.value; state.trainSessionOpen=false; render(); };
    var tplSelect = document.getElementById("trainTemplate");
    if(tplSelect) tplSelect.onchange = function(){ state.trainTemplateId = tplSelect.value; state.trainSessionOpen=false; render(); };
    var startBtn = document.getElementById("btnStartSession");
    if(startBtn) startBtn.onclick = function(){ state.trainSessionOpen = true; render(); };
    var cancelBtn = document.getElementById("btnCancelSession");
    if(cancelBtn) cancelBtn.onclick = function(){ state.trainSessionOpen = false; render(); };
    var finishBtn = document.getElementById("btnFinishSession");
    if(finishBtn) finishBtn.onclick = function(){
      var t = db.templates[state.trainTemplateId];
      var items = t.items.map(function(it){
        var sets = [];
        for(var s=0; s<it.sets; s++){
          var w = document.querySelector('.weightInput[data-ex="'+it.exerciseId+'"][data-set="'+s+'"]');
          var r = document.querySelector('.repsInput[data-ex="'+it.exerciseId+'"][data-set="'+s+'"]');
          sets.push({ weight: w && w.value!=="" ? parseFloat(w.value) : "", reps: r && r.value!=="" ? parseInt(r.value,10) : "" });
        }
        var ex = db.exercises[it.exerciseId];
        return { exerciseId: it.exerciseId, name: ex?ex.name:"", sets: sets };
      });
      db.logs[state.trainDate] = { templateId: t.id, templateName: t.name, items: items };
      save();
      showToast("Treino guardado!");
      state.trainSessionOpen = false;
      render();
    };
    var deleteSessBtn = document.getElementById("btnDeleteSession");
    if(deleteSessBtn) deleteSessBtn.onclick = function(){
      if(confirm("Remover o registo deste dia?")){
        delete db.logs[state.trainDate];
        save(); state.trainSessionOpen=false; render();
      }
    };
  }
}

/* ---------------- init ---------------- */
render();

})();
</script>
</body>
</html>
